kind = "web"
previewPath = "/pedal-patrol/"
title = "Pedal Patrol"
version = "1.0.0"
id = "artifacts/pedal-patrol"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pedal-patrol/" ]
localPort = 22652

[services.development]
run = "pnpm --filter @workspace/pedal-patrol run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pedal-patrol", "run", "build" ]
publicDir = "artifacts/pedal-patrol/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22652"
BASE_PATH = "/pedal-patrol/"
